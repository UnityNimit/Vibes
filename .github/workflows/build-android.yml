name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - '.github/workflows/**'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Android Universal APK via Tauri CLI
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npx tauri android build --apk --target aarch64 armv7 i686 x86_64 --ci

      - name: Prepare Deliverables
        run: |
          mkdir -p android_dist
          RAW_APK=$(find src-tauri/gen/android -name "*universal*release*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find src-tauri/gen/android -name "*release*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$RAW_APK" ]; then
            echo "Found APK at $RAW_APK"
            BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -n 1)
            ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

            if ! $APKSIGNER verify "$RAW_APK" 2>/dev/null; then
              echo "Signing APK with release.keystore..."
              if $ZIPALIGN -h 2>&1 | grep -q -- "-P"; then
                $ZIPALIGN -P 16 -f 4 "$RAW_APK" android_dist/Vibes.apk
              else
                $ZIPALIGN -p -f 4 "$RAW_APK" android_dist/Vibes.apk
              fi
              $APKSIGNER sign --ks src-tauri/gen/android/app/release.keystore --ks-key-alias vibes --ks-pass pass:vibespassword --key-pass pass:vibespassword --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true android_dist/Vibes.apk
            else
              echo "APK is already signed by Gradle, copying to distribution..."
              cp "$RAW_APK" android_dist/Vibes.apk
            fi

            $APKSIGNER verify --verbose android_dist/Vibes.apk
            ls -lh android_dist/Vibes.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vibes-Android-Universal
          path: android_dist/*
          if-no-files-found: warn

      - name: Attach APK to GitHub Release v1.0.0
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "android_dist/Vibes.apk" ]; then
            echo "Uploading android_dist/Vibes.apk to release v1.0.0"
            gh release upload v1.0.0 "android_dist/Vibes.apk" --clobber -R ${{ github.repository }} || true
          fi
