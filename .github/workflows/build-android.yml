name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.1.10909125
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Android Universal APK via Tauri CLI
        run: |
          npx tauri android build --apk

      - name: Prepare Deliverables
        run: |
          mkdir -p android_dist
          RAW_APK=$(find src-tauri/gen/android -name "*universal*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$RAW_APK" ]; then
            echo "Found APK at $RAW_APK"
            # Align and sign with release key so it installs seamlessly on all devices
            keytool -genkeypair -v -keystore release.keystore -alias vibes -keyalg RSA -keysize 2048 -validity 10000 -storepass vibes123 -keypass vibes123 -dname "CN=Vibes, OU=Vibes, O=Vibes, L=San Francisco, S=CA, C=US"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass vibes123 "$RAW_APK" vibes
            cp "$RAW_APK" android_dist/Vibes.apk
            ls -lh android_dist/Vibes.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vibes-Android-Universal
          path: android_dist/*
          if-no-files-found: warn

      - name: Attach APK to GitHub Release v1.0.0
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "android_dist/Vibes.apk" ]; then
            echo "Uploading android_dist/Vibes.apk to release v1.0.0"
            gh release upload v1.0.0 "android_dist/Vibes.apk" --clobber -R ${{ github.repository }} || true
          fi
