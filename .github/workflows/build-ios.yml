name: Build iOS Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-ios.yml'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Configure iOS Background Audio in Info.plist
        run: |
          PLIST_PATH=$(find src-tauri/gen/apple -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            echo "Configuring Info.plist at $PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" 2>/dev/null || true
          fi

      - name: Build iOS App via Tauri CLI
        run: |
          npx tauri ios build --no-sign || npx tauri ios build || true

      - name: Package Unsigned IPA (AltStore / Sideloadly / TrollStore Compatible)
        run: |
          mkdir -p build_output/Payload
          
          # Find the generated .app bundle
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Packaging app from $APP_PATH"
            cp -R "$APP_PATH" build_output/Payload/Vibes.app
            cd build_output
            zip -r Vibes.ipa Payload
            cd ..
            echo "Successfully created build_output/Vibes.ipa"
            ls -lh build_output/Vibes.ipa
          else
            echo "Notice: .app not found directly. Checking for .ipa..."
            IPA_PATH=$(find src-tauri -name "*.ipa" | head -n 1)
            if [ -n "$IPA_PATH" ]; then
              cp "$IPA_PATH" build_output/Vibes.ipa
              echo "Copied existing IPA from $IPA_PATH"
            else
              echo "Fatal: Could not find generated .app or .ipa file!"
              exit 1
            fi
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibes-iOS-IPA
          path: build_output/Vibes.ipa
          if-no-files-found: error
