name: Build iOS Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-ios.yml'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Configure iOS Background Audio in Info.plist
        run: |
          PLIST_PATH=$(find src-tauri/gen/apple -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            echo "Found Info.plist at $PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" 2>/dev/null || true
          else
            echo "Warning: Info.plist not found after tauri ios init"
          fi

      - name: Build iOS Application
        run: |
          BUILD_FLAG="${{ github.event.inputs.build_type == 'debug' && '--debug' || '' }}"
          npx tauri ios build --no-watch $BUILD_FLAG --target aarch64-apple-ios || true

      - name: Package Unsigned IPA (AltStore / Sideloadly / TrollStore Compatible)
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Packaging app from $APP_PATH"
            cp -R "$APP_PATH" build_output/Payload/Vibes.app
            cd build_output
            zip -r Vibes.ipa Payload
            cd ..
          else
            echo "Notice: Standard .app folder was not directly generated by CLI without developer certificate."
            echo "Zipping complete apple project directory for Xcode archive..."
            cd src-tauri/gen
            zip -r ../../build_output/Vibes-Xcode-Project.zip apple
            cd ../..
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibes-iOS-Build
          path: build_output/*
          if-no-files-found: warn
