name: Build iOS Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-ios.yml'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Configure iOS Background Audio in Info.plist
        run: |
          PLIST_PATH=$(find src-tauri/gen/apple -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            echo "Configuring Info.plist at $PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" 2>/dev/null || true
          fi

      - name: Build Unsigned Xcode Archive
        run: |
          PROJECT_PATH=$(find src-tauri/gen/apple -name "*.xcodeproj" | head -n 1)
          echo "Found project at $PROJECT_PATH"
          
          # Detect the iOS scheme (e.g. tauri-app_iOS or Vibes_iOS)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | grep -A 10 "Schemes:" | grep -E "_iOS|Vibes|tauri" | head -n 1 | tr -d ' ')
          echo "Selected Scheme: $SCHEME_NAME"
          
          # Build archive without requiring code signing
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath src-tauri/gen/apple/build/App.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA (AltStore / Sideloadly / TrollStore Compatible)
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find src-tauri/gen/apple/build/App.xcarchive -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Falling back to checking DerivedData for .app bundle..."
            APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Packaging app from $APP_PATH"
            cp -R "$APP_PATH" build_output/Payload/Vibes.app
            cd build_output
            zip -r Vibes.ipa Payload
            cd ..
            echo "Successfully generated build_output/Vibes.ipa"
          else
            echo "Error: Could not locate .app bundle after archive!"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibes-iOS-IPA
          path: build_output/Vibes.ipa
          if-no-files-found: error
