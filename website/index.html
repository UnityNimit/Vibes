<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Vibes — Pure Music for All Devices</title>
  
  <!-- Meta & OpenGraph -->
  <meta name="description" content="Ultra-minimalist, zero-ad music player with peer-to-peer jamming, synchronized lyrics, and offline playback. Available on iOS, Android, Windows, Mac, and Linux." />
  <meta property="og:title" content="Vibes — Pure Music for All Devices" />
  <meta property="og:description" content="Zero ads. Zero algorithms. Just pure music across iOS, Android, and Desktop." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://unitynimit.github.io/Vibes/" />
  <meta property="og:image" content="./icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          animation: {
            'glow-pulse': 'glowPulse 5s ease-in-out infinite',
            'fade-in': 'fadeIn 0.25s ease-out',
          },
          keyframes: {
            glowPulse: {
              '0%, 100%': { opacity: '0.25', transform: 'scale(1)' },
              '50%': { opacity: '0.55', transform: 'scale(1.08)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(4px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Absolute Zero Scroll & Pure AMOLED Black */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      background-color: #000000;
      color: #eaeaea;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Ambient Glow Behind Center Logo */
    .logo-ambient {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 50%, transparent 72%);
    }

    /* Tactile button press on touch / click */
    .touch-action-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body class="h-full h-[100dvh] max-h-[100dvh] w-full flex flex-col justify-between selection:bg-white selection:text-black overflow-hidden pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">

  <!-- ==================== TOP BAR (EDGE TO EDGE) ==================== -->
  <header class="w-full px-5 sm:px-8 py-3.5 sm:py-4 flex items-center justify-between flex-shrink-0 z-10 border-b border-white/[0.04]">
    <!-- Left Edge: Official Logo + Title -->
    <a href="#" class="flex items-center gap-2.5 group">
      <img src="./logo.svg" alt="Vibes" class="w-7 h-7 object-contain transition-transform group-hover:scale-105" />
      <span class="text-base font-bold tracking-tight text-white">Vibes</span>
    </a>

    <!-- Right Edge: GitHub Link -->
    <a
      href="https://github.com/UnityNimit/Vibes"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium text-neutral-300 bg-white/[0.05] hover:bg-white/[0.12] border border-white/10 transition-colors"
      aria-label="GitHub Repository"
    >
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      <span>GitHub</span>
    </a>
  </header>

  <!-- ==================== MAIN HERO (2X BIGGER LOGO, PERFECT FIT) ==================== -->
  <main class="flex-1 w-full flex flex-col items-center justify-center text-center my-auto px-4 overflow-hidden">
    
    <div class="w-full max-w-md mx-auto flex flex-col items-center">
      
      <!-- Official Logo Centerpiece (2X BIGGER with Ambient Backlight Glow) -->
      <div class="relative mb-3 sm:mb-4 flex items-center justify-center">
        <div class="absolute w-44 h-44 sm:w-56 sm:h-56 rounded-full logo-ambient animate-glow-pulse pointer-events-none"></div>
        <img
          src="./logo.svg"
          alt="Vibes Official Logo"
          class="relative w-28 h-28 sm:w-40 sm:h-40 object-contain drop-shadow-[0_12px_40px_rgba(255,255,255,0.28)] select-none"
        />
      </div>

      <!-- App Name & Tagline -->
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-1">
        Vibes
      </h1>
      <p class="text-xs sm:text-sm text-neutral-400 font-normal max-w-xs sm:max-w-sm mx-auto leading-tight mb-4 sm:mb-5">
        Pure sound. Zero ads. Endless music.<br />
        <span class="text-neutral-500 text-[11px] sm:text-xs">Listen together across all your devices.</span>
      </p>

      <!-- ==================== PLATFORM SELECTOR TABS ==================== -->
      <div class="w-full max-w-xs sm:max-w-sm mb-3 sm:mb-3.5 flex items-center justify-center">
        <div class="inline-flex p-1 rounded-2xl bg-white/[0.04] border border-white/[0.08] backdrop-blur-md overflow-x-auto max-w-full scrollbar-none gap-1" id="platformPills">
          <button onclick="selectPlatform('ios')" id="btn-tab-ios" class="px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-medium transition-all text-neutral-400 hover:text-white">
            iOS
          </button>
          <button onclick="selectPlatform('android')" id="btn-tab-android" class="px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-medium transition-all text-neutral-400 hover:text-white">
            Android
          </button>
          <button onclick="selectPlatform('windows')" id="btn-tab-windows" class="px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-medium transition-all text-neutral-400 hover:text-white">
            Windows
          </button>
          <button onclick="selectPlatform('macos')" id="btn-tab-macos" class="px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-medium transition-all text-neutral-400 hover:text-white">
            macOS
          </button>
          <button onclick="selectPlatform('linux')" id="btn-tab-linux" class="px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-medium transition-all text-neutral-400 hover:text-white">
            Linux
          </button>
        </div>
      </div>

      <!-- ==================== PRIMARY DOWNLOAD ACTION ==================== -->
      <div class="w-full max-w-[280px] sm:max-w-xs flex flex-col items-center gap-1.5 mb-1.5">
        <a
          id="mainDownloadBtn"
          href="https://github.com/UnityNimit/Vibes/releases/latest/download/Vibes.exe"
          class="w-full py-3.5 px-5 rounded-2xl bg-white text-black font-semibold text-sm sm:text-base shadow-[0_8px_30px_rgba(255,255,255,0.22)] hover:bg-neutral-200 transition-all flex items-center justify-center gap-2.5 touch-action-btn cursor-pointer"
        >
          <!-- Dynamic Platform Icon -->
          <span id="mainDownloadIcon" class="flex-shrink-0"></span>
          <span id="mainDownloadText" class="font-bold">Download for Windows</span>
          <span id="mainDownloadBadge" class="text-[10px] sm:text-[11px] font-mono px-2 py-0.5 rounded-md bg-black/10 text-black/70 font-semibold ml-auto sm:ml-0">
            6.6 MB
          </span>
        </a>

        <!-- Dynamic 1-line installation helper note -->
        <p id="platformHelperNote" class="text-[11px] text-neutral-400 font-normal leading-tight animate-fade-in text-center px-1">
          Portable 64-bit EXE • No installation needed
        </p>
      </div>

      <!-- ==================== ESSENTIAL PILLARS (Clean & Compact) ==================== -->
      <div class="grid grid-cols-3 gap-2 w-full max-w-[280px] sm:max-w-xs pt-3 sm:pt-4 border-t border-white/[0.06] text-center mt-2.5 sm:mt-3.5">
        <div class="py-0.5">
          <div class="text-[11px] sm:text-xs font-semibold text-white">Zero Ads</div>
          <div class="text-[10px] text-neutral-500">Free forever</div>
        </div>
        <div class="py-0.5 border-x border-white/[0.06]">
          <div class="text-[11px] sm:text-xs font-semibold text-white">Live Jam</div>
          <div class="text-[10px] text-neutral-500">Listen together</div>
        </div>
        <div class="py-0.5">
          <div class="text-[11px] sm:text-xs font-semibold text-white">Offline</div>
          <div class="text-[10px] text-neutral-500">Cache songs</div>
        </div>
      </div>

    </div>
  </main>

  <!-- ==================== FOOTER (EDGE TO EDGE) ==================== -->
  <footer class="w-full px-5 sm:px-8 py-3 sm:py-3.5 flex items-center justify-between text-[11px] text-neutral-500 border-t border-white/[0.04] flex-shrink-0 z-10">
    <!-- Left Edge: Brand & License -->
    <div class="flex items-center gap-1.5">
      <img src="./logo.svg" alt="Vibes" class="w-3.5 h-3.5 object-contain opacity-50" />
      <span>Vibes • Open Source</span>
    </div>

    <!-- Right Edge: Links -->
    <div class="flex items-center gap-4">
      <a href="https://github.com/UnityNimit/Vibes/releases" class="hover:text-neutral-300 transition-colors">Releases</a>
      <a href="https://github.com/UnityNimit/Vibes/blob/main/LICENSE" class="hover:text-neutral-300 transition-colors">License</a>
      <a href="https://github.com/UnityNimit/Vibes/issues" class="hover:text-neutral-300 transition-colors">Issues</a>
    </div>
  </footer>

  <!-- ==================== SMART PLATFORM SCRIPT ==================== -->
  <script>
    const PLATFORMS = {
      ios: {
        name: 'iOS',
        text: 'Download for iOS',
        badge: '2.5 MB',
        url: 'https://github.com/UnityNimit/Vibes/releases/latest/download/Vibes.ipa',
        note: 'Direct .ipa • Install with AltStore, Sideloadly, or Scarlet',
        icon: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.08 1.73-.95 2.76 1.01.08 2.06-.51 2.68-1.26z"/></svg>`
      },
      android: {
        name: 'Android',
        text: 'Download for Android',
        badge: '14.2 MB',
        url: 'https://github.com/UnityNimit/Vibes/releases/latest/download/Vibes.apk',
        note: 'Universal APK • Android 7.0+ (Allow install from this source)',
        icon: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-1.0003s.4482-1.0003.9993-1.0003c.5516 0 .9998.4486.9998 1.0003s-.4482 1.0003-.9998 1.0003m-11.046 0c-.5511 0-.9993-.4486-.9993-1.0003s.4482-1.0003.9993-1.0003c.5516 0 .9998.4486.9998 1.0003s-.4482 1.0003-.9998 1.0003m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.4116 13.8533 8.0818 12 8.0818s-3.5902.3298-5.1368.8679L4.8409 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/></svg>`
      },
      windows: {
        name: 'Windows',
        text: 'Download for Windows',
        badge: '6.6 MB',
        url: 'https://github.com/UnityNimit/Vibes/releases/latest/download/Vibes.exe',
        note: 'Portable 64-bit EXE • No install or admin rights needed',
        icon: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.901-1.751"/></svg>`
      },
      macos: {
        name: 'macOS',
        text: 'Download for Mac',
        badge: 'Universal',
        url: 'https://github.com/UnityNimit/Vibes/releases/latest',
        note: 'Apple Silicon (M1-M4) & Intel • Grab release on GitHub',
        icon: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.08 1.73-.95 2.76 1.01.08 2.06-.51 2.68-1.26z"/></svg>`
      },
      linux: {
        name: 'Linux',
        text: 'Download for Linux',
        badge: '64-bit',
        url: 'https://github.com/UnityNimit/Vibes/releases/latest',
        note: 'AppImage & tarball • Grab release on GitHub',
        icon: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.001 2c-3.15 0-5.71 2.56-5.71 5.71 0 .61.1 1.2.28 1.76C4.461 10.38 3 12.51 3 15c0 3.31 2.69 6 6 6h6c3.31 0 6-2.69 6-6 0-2.49-1.46-4.62-3.57-5.53.18-.56.28-1.15.28-1.76 0-3.15-2.56-5.71-5.709-5.71z"/></svg>`
      }
    };

    function detectUserPlatform() {
      const ua = navigator.userAgent || navigator.vendor || window.opera || '';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      if (/Macintosh|Mac OS X/i.test(ua)) return 'macos';
      if (/Linux/i.test(ua) && !/Android/i.test(ua)) return 'linux';
      return 'windows';
    }

    function selectPlatform(key) {
      if (!PLATFORMS[key]) return;
      const data = PLATFORMS[key];

      const btn = document.getElementById('mainDownloadBtn');
      const icon = document.getElementById('mainDownloadIcon');
      const text = document.getElementById('mainDownloadText');
      const badge = document.getElementById('mainDownloadBadge');
      const note = document.getElementById('platformHelperNote');

      btn.href = data.url;
      icon.innerHTML = data.icon;
      text.innerText = data.text;
      badge.innerText = data.badge;
      note.innerText = data.note;

      const pillKeys = ['ios', 'android', 'windows', 'macos', 'linux'];
      pillKeys.forEach(k => {
        const tab = document.getElementById('btn-tab-' + k);
        if (k === key) {
          tab.className = 'px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-semibold bg-white text-black shadow-sm transition-all';
        } else {
          tab.className = 'px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl text-xs font-medium text-neutral-400 hover:text-white transition-all';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      selectPlatform(detectUserPlatform());
    });
  </script>
</body>
</html>
