<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vibes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            console.error('Global window error:', e.message, e.filename, e.lineno, e.error);
          });
          window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
          });
        }
        if (typeof navigator !== 'undefined') {
          var ua = navigator.userAgent || '';
          var isAndroid = /Android/i.test(ua);
          var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (isAndroid || isIOS || /mobile|tablet/i.test(ua)) {
            document.documentElement.classList.add('is-mobile');
          }
          if (isAndroid) {
            document.documentElement.classList.add('is-mobile-android');
          }
          if (isIOS) {
            document.documentElement.classList.add('is-mobile-ios');
          }
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
